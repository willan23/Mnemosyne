apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveReleaseStoreFile = { path ->
    def appRelative = file(path)
    if (appRelative.exists()) {
        return appRelative
    }
    return rootProject.file(path)
}

def releaseStoreFilePath = keystoreProperties['storeFile'] ?: findProperty('MNEMOSYNE_RELEASE_STORE_FILE') ?: System.getenv('MNEMOSYNE_RELEASE_STORE_FILE') ?: '../keystores/mnemosyne-release.keystore'
def releaseStoreFile = resolveReleaseStoreFile(releaseStoreFilePath)
def releaseStorePassword = keystoreProperties['storePassword'] ?: findProperty('MNEMOSYNE_RELEASE_STORE_PASSWORD') ?: System.getenv('MNEMOSYNE_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = keystoreProperties['keyAlias'] ?: findProperty('MNEMOSYNE_RELEASE_KEY_ALIAS') ?: System.getenv('MNEMOSYNE_RELEASE_KEY_ALIAS')
def releaseKeyPassword = keystoreProperties['keyPassword'] ?: findProperty('MNEMOSYNE_RELEASE_KEY_PASSWORD') ?: System.getenv('MNEMOSYNE_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePassword && releaseKeyAlias && releaseKeyPassword && releaseStoreFile.exists()
def releaseVersionCode = (findProperty('MNEMOSYNE_VERSION_CODE') ?: System.getenv('MNEMOSYNE_VERSION_CODE') ?: keystoreProperties['versionCode'] ?: '1') as Integer
def releaseVersionName = findProperty('MNEMOSYNE_VERSION_NAME') ?: System.getenv('MNEMOSYNE_VERSION_NAME') ?: keystoreProperties['versionName'] ?: '1.0.0'

android {
    namespace = "com.mnemosyne.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mnemosyne.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            // Hosting installers include previous APKs and Windows binaries. Package app assets only.
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:downloads'
        }
    }
    signingConfigs {
        release {
            storeFile releaseStoreFile
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

// Reject release graphs before executing tasks; never report an unsigned release as ready.
gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { task -> task.project == project && task.name in ['assembleRelease', 'bundleRelease', 'packageRelease', 'packageReleaseBundle', 'signReleaseBundle'] }
    if (releaseRequested) {
        if (!hasReleaseSigning) {
            throw new GradleException('Release signing configuration is required. Configure it privately; debug builds remain available.')
        }
        def explicitCode = findProperty('MNEMOSYNE_VERSION_CODE')
        def explicitName = findProperty('MNEMOSYNE_VERSION_NAME')
        if (!explicitCode || !explicitName || !(explicitCode ==~ /[1-9][0-9]*/) || explicitCode.toLong() > 2100000000L || !(explicitName ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:[-+][0-9A-Za-z.-]+)?/)) {
            throw new GradleException('Release requires explicit MNEMOSYNE_VERSION_CODE and MNEMOSYNE_VERSION_NAME project properties.')
        }
        def webVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
        if (explicitName != webVersion) {
            throw new GradleException('Release version name must match the frontend package.')
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
