[package]
name = "mnemosyne"
version = "1.0.9"
description = "Cognitive Universe Engine"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-process = "^2.0.0"
tauri-plugin-updater = "=2.14.0"
tauri-plugin-dialog = "^2.0.0"
tauri-plugin-fs = "^2.0.0"
tauri-plugin-global-shortcut = "^2.0.0"
open = "5"
url = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]

[patch.crates-io]
# Preserve ZIP updates with the fixed ZIP dependency until upstream adopts it.
tauri-plugin-updater = { path = "vendor/tauri-plugin-updater" }

[workspace]
members = ["vendor/tauri-plugin-updater"]
default-members = ["."]
resolver = "2"
