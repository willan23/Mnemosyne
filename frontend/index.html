<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <script src="/clip-ingress.js"></script>
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Seu biógrafo pessoal com criptografia end-to-end e knowledge graph inteligente" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mnemosyne" />
    
    <title>Mnemosyne - Seu Biógrafo de Conhecimento</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('mnemosyne-universe-preferences');
          if (!raw) return;
          var parsed = JSON.parse(raw);
          var lang = parsed && parsed.state && parsed.state.language;
          var map = { 'pt-pt': 'pt-PT', 'pt-br': 'pt-BR', en: 'en', fr: 'fr' };
          if (lang && map[lang]) document.documentElement.lang = map[lang];
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
