name: Deploy to Firebase

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Desktop version matching the final application metadata'
        required: true
        default: '1.0.9'
      notes:
        description: 'Release notes for the signed desktop update'
        required: false
        default: 'Mnemosyne Cognitive OS desktop update.'
      android_release_asset_id:
        description: 'GitHub release asset ID of the approved signed Android APK'
        type: string
        required: true

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/desktop-release.yml
    with:
      version: ${{ inputs.version }}
      notes: ${{ inputs.notes }}
      deploy_release: true
      android_release_asset_id: ${{ inputs.android_release_asset_id }}
    secrets: inherit
